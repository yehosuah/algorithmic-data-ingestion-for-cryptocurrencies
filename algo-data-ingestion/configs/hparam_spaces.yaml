xgb:
  max_depth: [3, 5, 7, 9]
  learning_rate: [0.01, 0.03, 0.05, 0.1]
  n_estimators: [10, 25, 50]
  subsample: [0.6, 0.8, 1.0]
  colsample_bytree: [0.6, 0.8, 1.0]
  min_child_weight: [1.0, 3.0, 5.0, 10.0]
  gamma: [0.0, 0.5, 1.0, 3.0]
  reg_lambda: [0.5, 1.0, 2.0, 5.0]
  reg_alpha: [0.0, 0.1, 0.5, 1.0]
  early_stopping_rounds: [25, 50, 100]
  cost_bps: [2.5, 5.0, 7.5]
  long_only: [false, true]
  min_hold_bars: [1, 3]

tcn:
  kernel_size: [3, 5, 7]
  channels: ["32,32", "64,64", "64,128"]
  dropout: [0.0, 0.05, 0.1, 0.2, 0.3]
  lr: [0.0003, 0.001, 0.003]
  weight_decay: [0.0, 0.0001, 0.001]
  batch_size: [128, 256]
  epochs: [5, 10, 20]
  early_stopping_patience: [2, 4, 6, 10]
  max_grad_norm: [0.5, 1.0, 2.0]
  seq_len: [32, 48, 64]
  seq_stride: [1, 5, 10]
  horizon: [1, 2]
  cost_bps: [2.5, 5.0, 7.5]
  long_only: [false, true]
  min_hold_bars: [1, 3]

transformer:
  d_model: [64, 128, 256]
  nhead: [2, 4, 8]
  num_layers: [1, 2, 3]
  dim_feedforward: [64, 128, 256]
  dropout: [0.0, 0.1, 0.2, 0.3]
  lr: [0.0001, 0.0003, 0.001, 0.003]
  weight_decay: [0.0, 0.0001, 0.001]
  batch_size: [64, 96]
  epochs: [3, 5, 8]
  early_stopping_patience: [2, 3, 4]
  max_grad_norm: [0.5, 1.0, 2.0]
  seq_len: [32, 48, 64]
  seq_stride: [1, 5, 10]
  horizon: [1, 2]
  cost_bps: [2.5, 5.0, 7.5]
  long_only: [false, true]
  min_hold_bars: [1, 3]

deeplob:
  dropout: [0.05, 0.1, 0.2]
  lr: [0.0003, 0.001, 0.003]
  weight_decay: [0.0, 0.0001, 0.001]
  batch_size: [64, 128]
  epochs: [5, 10, 15]
  early_stopping_patience: [2, 4, 6, 10]
  max_grad_norm: [0.5, 1.0, 2.0]
  seq_len: [32, 48, 64]
  seq_stride: [1, 5, 10]
  cost_bps: [2.5, 5.0, 7.5]
  long_only: [false, true]
  min_hold_bars: [1, 3]

blender:
  C: [0.1, 1.0, 5.0]
  penalty: ["l2", "none"]
  max_iter: [500, 1000, 2000]

stacking_meta:
  C: [0.1, 1.0, 5.0]
  penalty: ["l2"]
  solver: ["lbfgs"]
  max_iter: [500, 1000, 2000]

regime_blender:
  C: [0.1, 1.0, 5.0]
  penalty: ["l2", "none"]
  solver: ["lbfgs"]
  max_iter: [500, 1000, 2000]
