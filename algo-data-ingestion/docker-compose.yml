services:
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    expose:
      - "6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$${REDIS_PASSWORD}' ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ingestion-api:
    build:
      context: .
      args:
        INSTALL_ML: 1
    # If you publish a built image later, you can replace the above with:
    # image: algo-data-ingestion:latest
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - EXCHANGE_SANDBOX_MODE=0
      - EXCHANGE_API_KEY=
      - EXCHANGE_API_SECRET=
      - FEATURE_NAMESPACE=features
      - FEATURE_TTL_SEC=3600
      - ML_SENTIMENT_ENABLED=1
      - SENTIMENT_MODEL_ID=distilbert/distilbert-base-uncased-finetuned-sst-2-english
      - ML_MAX_WORKERS=4
      - HF_HOME=/app/.cache/huggingface
      - SOCIAL_SENTIMENT_ENRICH=0
    volumes:
      - ./data_lake:/app/data_lake
      - hf-cache:/app/.cache/huggingface
      # - ./secrets:/secrets:ro  # mount GCP SA JSON here and set GOOGLE_APPLICATION_CREDENTIALS
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      uvicorn app.ingestion_service.main:app
      --host 0.0.0.0
      --port 8000
      --workers 1
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    command:
      - "--redis.addr=redis://:${REDIS_PASSWORD}@redis:6379"
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      ingestion-api:
        condition: service_started
    command: [ "--config.file=/etc/prometheus/prometheus.yml",
               "--storage.tsdb.path=/prometheus",
               "--web.enable-lifecycle" ]
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  scheduler:
    build:
      context: .
      args:
        INSTALL_ML: 1
    command: python -m app.scheduler.main
    depends_on:
      ingestion-api:
        condition: service_started
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://ingestion-api:8000
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - RUN_ON_START=1
      - SCHED_TZ=UTC
      - SCHED_METRICS_PORT=9002
      - MODELS_ROOT=/opt/models
      - DATA_LAKE_ROOT=/app/data_lake/market
      - DECISION_QUEUE_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DECISION_QUEUE_KEY=trading:decisions
      - TRADING_DECISION_HMAC_SECRET=${TRADING_DECISION_HMAC_SECRET:?set TRADING_DECISION_HMAC_SECRET in .env}
      - EXCHANGE_SANDBOX_MODE=0
      - INFER_DEFAULT_STRIDE=1
      - INFER_HISTORY_MARGIN_MIN=30
      - INFER_APPLY_CALIBRATION=1
      - INFER_JOBS=[
          {"job_id":"portfolio_policy_primary","exchange":"binance","symbol":"ETH/USDT","timeframe":"1m","lookback_minutes":60,"history_minutes":120,"base_model":"xgb_primary","base_path":"base_xgb_h120_calmon_spread0","stride":1,"include_features":true,"queue_key":"trading:decisions","cron":"*/1 * * * *","policy_id":"primary","shadow_mode":false,"max_decision_items":1},
          {"job_id":"portfolio_policy_primary_btc","exchange":"binance","symbol":"BTC/USDT","timeframe":"1m","lookback_minutes":60,"history_minutes":120,"base_model":"xgb_primary","base_path":"base_xgb_h120_calmon_spread0","stride":1,"include_features":true,"queue_key":"trading:decisions","cron":"*/1 * * * *","policy_id":"conservative","shadow_mode":false,"max_decision_items":1},
          {"job_id":"portfolio_policy_primary_sol","exchange":"binance","symbol":"SOL/USDT","timeframe":"1m","lookback_minutes":60,"history_minutes":120,"base_model":"xgb_primary","base_path":"base_xgb_h120_calmon_spread0","stride":1,"include_features":true,"queue_key":"trading:decisions","cron":"*/1 * * * *","policy_id":"conservative","shadow_mode":false,"max_decision_items":1}
        ]
      - MARKET_JOBS=[
          {"exchange":"binance","symbol":"BTC/USDT","timeframe":"1m","lookback_minutes":240,"cron":"*/5 * * * *"},
          {"exchange":"binance","symbol":"BTC/USDT","timeframe":"5m","lookback_minutes":360,"cron":"*/15 * * * *"},
          {"exchange":"binance","symbol":"ETH/USDT","timeframe":"1m","lookback_minutes":240,"cron":"*/5 * * * *"},
          {"exchange":"binance","symbol":"SOL/USDT","timeframe":"1m","lookback_minutes":240,"cron":"*/5 * * * *"}
        ]
      - MARKET_INGEST_JOBS=[
          {"exchange":"binance","symbol":"BTC/USDT","granularity":"1m","limit":360,"cron":"*/1 * * * *"},
          {"exchange":"binance","symbol":"ETH/USDT","granularity":"1m","limit":360,"cron":"*/1 * * * *"},
          {"exchange":"binance","symbol":"SOL/USDT","granularity":"1m","limit":360,"cron":"*/1 * * * *"}
        ]
      - TTL_SWEEP_CRON=*/15 * * * *
      - TTL_SWEEP_PATTERN=features:market:*
      - TTL_SWEEP_TTL=3600
      - DATA_LAKE_RETENTION_DAYS=2
      - 'DATA_LAKE_CLEANUP_CRON=30 2 * * *'
    ports:
      - "9002:9002"
    volumes:
      - ./data_lake:/app/data_lake
      - ./experiments/perf_sweeps:/opt/models/perf_sweeps
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9002/metrics >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  trading:
    build:
      context: .
      args:
        INSTALL_ML: 1
    command: python -m app.trading.main
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DECISION_QUEUE_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DECISION_QUEUE_KEY=trading:decisions
      - TRADING_DECISION_HMAC_SECRET=${TRADING_DECISION_HMAC_SECRET:?set TRADING_DECISION_HMAC_SECRET in .env}
      - MODELS_ROOT=/opt/models
      - EXCHANGE_SANDBOX_MODE=0
      - EXCHANGE_API_KEY=
      - EXCHANGE_API_SECRET=
      - TRADING_MODELS=[{"model":"xgb_primary","symbol":"ETH/USDT","exchange":"binance","timeframe":"1m","order_notional":45.0,"max_spread_bps":8,"stop_loss_pct":0.008,"take_profit_pct":null,"profit_trailing_start_pct":0.004,"profit_trailing_stop_pct":0.002,"max_hold_minutes":240,"shadow_mode":false,"policy_id":"primary","min_hold_bars_override":15,"disable_prob_exits":true,"entry_rsi_min":50.0},{"model":"xgb_primary","symbol":"BTC/USDT","exchange":"binance","timeframe":"1m","order_notional":25.0,"max_spread_bps":8,"stop_loss_pct":0.005,"take_profit_pct":null,"profit_trailing_start_pct":null,"profit_trailing_stop_pct":null,"max_hold_minutes":90,"shadow_mode":false,"policy_id":"conservative","min_hold_bars_override":15,"disable_prob_exits":true,"entry_macd_min":0.0},{"model":"xgb_primary","symbol":"SOL/USDT","exchange":"binance","timeframe":"1m","order_notional":30.0,"max_spread_bps":8,"stop_loss_pct":0.005,"take_profit_pct":null,"profit_trailing_start_pct":null,"profit_trailing_stop_pct":null,"max_hold_minutes":90,"shadow_mode":false,"policy_id":"conservative","min_hold_bars_override":15,"disable_prob_exits":true,"entry_rsi_min":45.0}]
      - TRADING_SHADOW_SYMBOLS=[]
      - TRADING_DRY_RUN=true
      - TRADING_RISK_LIMITS_PATH=configs/runtime_overrides/risk_limits_stage_0.yaml
      - TRADING_DEADLOCK_POLICY_PATH=configs/runtime_overrides/deadlock_policy_stage_0.yaml
      - TRADING_INTENT_LEDGER_BACKEND=redis
      - TRADING_INTENT_LEDGER_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - TRADING_AUDIT_HMAC_KEY=${TRADING_AUDIT_HMAC_KEY}
      - TRADING_METRICS_PORT=9010
      - TRADING_STATE_PATH=/app/trading_state/state.json
      - TRADING_STATE_BACKEND=file
      - TRADING_STATE_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - TRADING_AUDIT_BACKEND=file
      - TRADING_AUDIT_LOG_PATH=/app/data_lake/trading/audit.log
      - TRADING_PRICE_MONITOR_INTERVAL_SECONDS=10
      - TRADING_AUDIT_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - TRADING_LAST_TS_GRACE_BARS=10
      - TRADING_DECISION_MAX_AGE_SECONDS=240
      - TRADING_LOG_LEVEL=DEBUG
    volumes:
      - ./data_lake:/app/data_lake
      - trading-state:/app/trading_state
      - ./logs/trading:/app/logs
      - ./experiments/perf_sweeps:/opt/models/perf_sweeps
      - ./configs/runtime_overrides:/app/configs/runtime_overrides
    ports:
      - "9010:9010"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9010/metrics >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data: {}
  prometheus-data: {}
  market-data: {}
      # S3/GCS (opt-in)
      # AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      # AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      # AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      # GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      # FSSPEC_STORAGE_OPTIONS=${FSSPEC_STORAGE_OPTIONS}
  hf-cache: {}
  trading-state: {}
